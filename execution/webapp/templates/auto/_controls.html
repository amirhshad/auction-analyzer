<!-- Auction selector + stats + market lookup -->
<div class="flex flex-col gap-4" x-data="{ selectedAuction: '{{ selected_auction }}' }">
    <!-- Row: Auction selector + delete + market lookup -->
    <div class="flex items-end gap-3">
        <div class="w-72">
            <label class="block text-xs font-medium text-gray-500 mb-1">Select Auction</label>
            <select name="auction" id="auto-auction-select"
                    x-model="selectedAuction"
                    hx-get="/auto/tab/{{ active_tab or 'favorites' }}"
                    hx-target="#tab-content"
                    hx-include="#auto-make-select, #auto-fuel-select"
                    hx-swap="innerHTML"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                <option value="All" {{ 'selected' if selected_auction == 'All' }}>All</option>
                {% for name in auction_names %}
                <option value="{{ name }}" {{ 'selected' if selected_auction == name }}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
        <button x-show="selectedAuction !== 'All'" x-cloak
                @click="if (confirm('Delete all vehicles from \'' + selectedAuction + '\'?')) {
                    fetch('/api/auto/auction/' + encodeURIComponent(selectedAuction), { method: 'DELETE' })
                        .then(() => window.location.href = '/auto');
                }"
                class="px-3 py-2 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50 cursor-pointer">
            Delete Auction
        </button>
        <form hx-post="/auto/lookup-market" hx-target="#action-result" hx-swap="innerHTML"
              hx-include="#auto-auction-select" class="ml-auto">
            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700">
                Lookup Market Prices (Gaspedaal)
            </button>
        </form>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-4 gap-4">
        <div class="bg-white rounded-lg border border-gray-200 p-4">
            <p class="text-xs font-medium text-gray-500">Total Vehicles</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">{{ stats.total_vehicles }}</p>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4">
            <p class="text-xs font-medium text-gray-500">Total Bids</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">{{ stats.total_bids }}</p>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4">
            <p class="text-xs font-medium text-gray-500">Total Bid Value</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">&euro;{{ "{:,.0f}".format(stats.total_bid_value) }}</p>
        </div>
        <div class="bg-white rounded-lg border border-gray-200 p-4">
            <p class="text-xs font-medium text-gray-500">Avg Bid</p>
            <p class="text-2xl font-bold text-gray-900 mt-1">&euro;{{ "{:,.0f}".format(stats.avg_bid) }}</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex gap-3">
        <div class="w-48">
            <label class="block text-xs font-medium text-gray-500 mb-1">Filter by Make</label>
            <select name="make" id="auto-make-select"
                    hx-get="/auto/tab/{{ active_tab or 'favorites' }}"
                    hx-target="#tab-content"
                    hx-include="#auto-auction-select, #auto-fuel-select"
                    hx-swap="innerHTML"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                <option value="All" {{ 'selected' if selected_make == 'All' }}>All</option>
                {% for m in makes %}
                <option value="{{ m }}" {{ 'selected' if selected_make == m }}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="w-48">
            <label class="block text-xs font-medium text-gray-500 mb-1">Filter by Fuel Type</label>
            <select name="fuel" id="auto-fuel-select"
                    hx-get="/auto/tab/{{ active_tab or 'favorites' }}"
                    hx-target="#tab-content"
                    hx-include="#auto-auction-select, #auto-make-select"
                    hx-swap="innerHTML"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white">
                <option value="All" {{ 'selected' if selected_fuel == 'All' }}>All</option>
                {% for f in fuels %}
                <option value="{{ f }}" {{ 'selected' if selected_fuel == f }}>{{ f }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>
